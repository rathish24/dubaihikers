<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f0ede4;color:#171b17;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f0ede4">
      <tr>
        <td align="center" style="padding:40px 20px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #d8d5cc">
            <tr>
              <td style="padding:36px">
                <p style="margin:0 0 28px;font-size:13px;font-weight:700;letter-spacing:1.5px;color:#e24a2a">
                  DUBAI/HIKERS
                </p>
                <h1 style="margin:0 0 20px;font-size:30px;line-height:1.1">
                  Your next trail starts here.
                </h1>
                <p style="margin:0 0 16px;font-size:16px;line-height:1.6">
                  Hi {{contact_name}},
                </p>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6">
                  Thanks for booking with Dubai Hikers.
                </p>
                <p style="margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:1px">
                  YOUR BOOKING REFERENCE
                </p>
                <p style="margin:0 0 28px;font-size:26px;font-weight:700;letter-spacing:1px">
                  {{reference_number}}
                </p>
                <p style="margin:0 0 16px;font-size:16px;line-height:1.6">
                  Keep it handy for future communication. We’ll contact you shortly with the next steps.
                </p>
                <p style="margin:0;font-size:16px;line-height:1.6">
                  The mountains are calling. See you on the trail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
